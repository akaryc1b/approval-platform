name: Approval Platform Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: approval-platform-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject temporary PR artifacts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/workflows/pr53-release-deployment-validation.yml
          if [ -d .github/scripts ] \
            && find .github/scripts -type f -name 'apply-pr53-*' -print -quit | grep -q .; then
            echo 'Temporary PR helper remains in the committed tree.'
            exit 1
          fi
          if find .github -type f \
            \( -name 'pr53-*' -o -name '*.tgz.b64' -o -name '*.patch' \) \
            -print -quit | grep -q .; then
            echo 'Temporary patch payload remains in the committed tree.'
            exit 1
          fi
          if grep -R --line-number --fixed-strings 'default: local' \
            apps/server/src/main/resources/application.yml; then
            echo 'Base configuration must not activate the local profile.'
            exit 1
          fi
      - name: Verify final tracked-tree hygiene
        run: node --test scripts/tests/m3-repository-hygiene.test.mjs
      - name: Verify persistence CI sharding helpers
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/select-persistence-jdbc-tests.sh
          python3 -m py_compile scripts/ci/verify-persistence-jdbc-shards.py
          temporary_directory="$(mktemp -d)"
          trap 'rm -rf "$temporary_directory"' EXIT
          for shard in 0 1 2 3; do
            bash scripts/ci/select-persistence-jdbc-tests.sh \
              "$shard" 4 "${temporary_directory}/selected-tests-${shard}.txt" \
              >"${temporary_directory}/tests-${shard}.csv"
          done
          duplicate="$(
            cat "${temporary_directory}"/selected-tests-*.txt \
              | sort \
              | uniq -d \
              | head -n 1
          )"
          test -z "$duplicate"
      - name: Verify M4 identity and Flowable boundaries
        run: node --test scripts/tests/m4-identity-boundary.test.mjs
      - name: Verify M4 SLA and calendar boundaries
        shell: bash
        run: |
          node --test scripts/tests/m4-sla-calendar-boundary.test.mjs \
            >m4-sla-calendar-boundary.log 2>&1 \
            || { cat m4-sla-calendar-boundary.log; exit 1; }
          cat m4-sla-calendar-boundary.log
      - name: Verify M4 release governance observability boundaries
        shell: bash
        run: |
          node --test scripts/tests/m4-release-governance-boundary.test.mjs \
            >m4-release-governance-boundary.log 2>&1 \
            || { cat m4-release-governance-boundary.log; exit 1; }
          cat m4-release-governance-boundary.log
      - name: Verify M5 migration capability boundaries
        shell: bash
        run: |
          node --test scripts/tests/m5-migration-boundary.test.mjs \
            >m5-migration-boundary.log 2>&1 \
            || { cat m5-migration-boundary.log; exit 1; }
          node --test scripts/tests/m5-migration-parallel-boundary.test.mjs \
            >>m5-migration-boundary.log 2>&1 \
            || { cat m5-migration-boundary.log; exit 1; }
          node --test scripts/tests/m5-migration-history-boundary.test.mjs \
            >>m5-migration-boundary.log 2>&1 \
            || { cat m5-migration-boundary.log; exit 1; }
          node --test scripts/tests/m5-d3-engine-execution-boundary.test.mjs \
            >>m5-migration-boundary.log 2>&1 \
            || { cat m5-migration-boundary.log; exit 1; }
          node --test scripts/tests/m5-d4-exact-verification-boundary.test.mjs \
            >>m5-migration-boundary.log 2>&1 \
            || { cat m5-migration-boundary.log; exit 1; }
          node --test scripts/tests/m5-d5-runtime-binding-cas-boundary.test.mjs \
            >>m5-migration-boundary.log 2>&1 \
            || { cat m5-migration-boundary.log; exit 1; }
          node --test scripts/tests/m5-d6-durable-unknown-reconciliation-boundary.test.mjs \
            >>m5-migration-boundary.log 2>&1 \
            || { cat m5-migration-boundary.log; exit 1; }
          node --test scripts/tests/m5-d7-canary-orchestration-boundary.test.mjs \
            >>m5-migration-boundary.log 2>&1 \
            || { cat m5-migration-boundary.log; exit 1; }
          node --test scripts/tests/m5-d8-plan-aggregation-boundary.test.mjs \
            >>m5-migration-boundary.log 2>&1 \
            || { cat m5-migration-boundary.log; exit 1; }
          node --test scripts/tests/m5-e1-operations-visibility-boundary.test.mjs \
            >>m5-migration-boundary.log 2>&1 \
            || { cat m5-migration-boundary.log; exit 1; }
          node --test scripts/tests/m5-f1-fault-security-observability-boundary.test.mjs \
            >>m5-migration-boundary.log 2>&1 \
            || { cat m5-migration-boundary.log; exit 1; }
          node --test scripts/tests/m5-e2-advanced-diagnostics-boundary.test.mjs \
            >>m5-migration-boundary.log 2>&1 \
            || { cat m5-migration-boundary.log; exit 1; }
          node --test scripts/tests/m5-f2-deep-hardening-boundary.test.mjs \
            >>m5-migration-boundary.log 2>&1 \
            || { cat m5-migration-boundary.log; exit 1; }
          node --test scripts/tests/m5-g1-production-readiness-boundary.test.mjs \
            >>m5-migration-boundary.log 2>&1 \
            || { cat m5-migration-boundary.log; exit 1; }
          node --test scripts/tests/m5-g2-final-acceptance-boundary.test.mjs \
            >>m5-migration-boundary.log 2>&1 \
            || { cat m5-migration-boundary.log; exit 1; }
          cat m5-migration-boundary.log
      - name: Verify M6 AI foundation boundaries
        shell: bash
        run: |
          node --test scripts/tests/m6-ai-foundation-boundary.test.mjs \
            >m6-ai-foundation-boundary.log 2>&1 \
            || { cat m6-ai-foundation-boundary.log; exit 1; }
          cat m6-ai-foundation-boundary.log
      - name: Verify M6 AI activation review boundaries
        shell: bash
        run: |
          node --test scripts/tests/m6-ai-activation-review-boundary.test.mjs \
            >m6-ai-activation-review-boundary.log 2>&1 \
            || { cat m6-ai-activation-review-boundary.log; exit 1; }
          cat m6-ai-activation-review-boundary.log
      - name: Verify M6 AI transport review boundaries
        shell: bash
        run: |
          node --test scripts/tests/m6-ai-transport-review-boundary.test.mjs \
            >m6-ai-transport-review-boundary.log 2>&1 \
            || { cat m6-ai-transport-review-boundary.log; exit 1; }
          cat m6-ai-transport-review-boundary.log
      - name: Upload repository governance logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approval-hygiene-${{ github.run_id }}
          path: |
            m4-sla-calendar-boundary.log
            m4-release-governance-boundary.log
            m5-migration-boundary.log
            m6-ai-foundation-boundary.log
            m6-ai-activation-review-boundary.log
            m6-ai-transport-review-boundary.log
          if-no-files-found: ignore

  backend-core:
    name: Java 21 / Maven core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: git diff --check
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Maven core reactor
        shell: bash
        run: |
          set +e
          mvn -B -ntp verify \
            -Dapproval.persistence.tests.skip=true \
            >maven-core.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '--- Maven core failure tail ---'
            tail -n 240 maven-core.log
            exit "$status"
          fi
          tail -n 100 maven-core.log
      - name: Upload Maven core evidence part
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approval-maven-part-core-${{ github.run_id }}
          path: maven-core.log
          if-no-files-found: error

  persistence-jdbc:
    name: Persistence JDBC / shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 0
          - 1
          - 2
          - 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: git diff --check
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Select deterministic test shard
        id: selection
        shell: bash
        run: |
          set -euo pipefail
          shard="${{ matrix.shard }}"
          output_directory="persistence-shard-${shard}"
          mkdir -p "$output_directory"
          tests="$(
            bash scripts/ci/select-persistence-jdbc-tests.sh \
              "$shard" 4 "${output_directory}/selected-tests-${shard}.txt"
          )"
          printf 'tests=%s\n' "$tests" >>"$GITHUB_OUTPUT"
          cat "${output_directory}/selected-tests-${shard}.txt"
      - name: Verify Persistence JDBC shard
        shell: bash
        env:
          SELECTED_TESTS: ${{ steps.selection.outputs.tests }}
        run: |
          set +e
          shard="${{ matrix.shard }}"
          output_directory="persistence-shard-${shard}"
          log_file="${output_directory}/maven-persistence-shard-${shard}.log"
          mvn -B -ntp \
            -pl :approval-persistence-jdbc \
            -am verify \
            -Dtest="$SELECTED_TESTS" \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dapproval.persistence.test.fork-count=2 \
            >"$log_file" 2>&1
          status=$?
          report_directory="server-modules/approval-persistence-jdbc/target/surefire-reports"
          if [ -d "$report_directory" ]; then
            mkdir -p "${output_directory}/surefire-reports"
            cp -R "${report_directory}/." "${output_directory}/surefire-reports/"
          fi
          if [ "$status" -ne 0 ]; then
            echo "--- Persistence JDBC shard ${shard} failure tail ---"
            tail -n 240 "$log_file"
            exit "$status"
          fi
          tail -n 100 "$log_file"
      - name: Upload Persistence JDBC evidence part
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approval-maven-part-persistence-${{ matrix.shard }}-${{ github.run_id }}
          path: persistence-shard-${{ matrix.shard }}
          if-no-files-found: error

  backend:
    name: Java 21 / Maven / PostgreSQL
    needs:
      - backend-core
      - persistence-jdbc
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download Maven evidence parts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: approval-maven-part-*-${{ github.run_id }}
          path: backend-parts
      - name: Assemble and verify Maven evidence
        shell: bash
        env:
          CORE_RESULT: ${{ needs.backend-core.result }}
          PERSISTENCE_RESULT: ${{ needs.persistence-jdbc.result }}
        run: |
          set +e
          mkdir -p backend-final
          python3 scripts/ci/verify-persistence-jdbc-shards.py \
            backend-parts \
            backend-final/persistence-jdbc-summary.txt \
            --expected-shards 4
          verification_status=$?

          {
            echo 'Approval Platform Maven verification'
            echo "backend core result: ${CORE_RESULT}"
            echo "persistence shard result: ${PERSISTENCE_RESULT}"
            echo
            while IFS= read -r -d '' log_file; do
              echo "===== ${log_file} ====="
              cat "$log_file"
              echo
            done < <(
              find backend-parts -type f -name 'maven-*.log' -print0 | sort -z
            )
            if [ -f backend-final/persistence-jdbc-summary.txt ]; then
              echo '===== Persistence JDBC shard summary ====='
              cat backend-final/persistence-jdbc-summary.txt
            fi
          } >backend-final/maven-verify.log

          {
            echo "backend core result: ${CORE_RESULT}"
            echo "persistence shard result: ${PERSISTENCE_RESULT}"
            echo "persistence verification status: ${verification_status}"
          } >backend-final/backend-gate.txt

          cat backend-final/backend-gate.txt
          if [ -f backend-final/persistence-jdbc-summary.txt ]; then
            cat backend-final/persistence-jdbc-summary.txt
          fi

          if [ "$CORE_RESULT" != 'success' ] \
            || [ "$PERSISTENCE_RESULT" != 'success' ] \
            || [ "$verification_status" -ne 0 ]; then
            exit 1
          fi
      - name: Upload Maven summary evidence part
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approval-maven-part-summary-${{ github.run_id }}
          path: backend-final
          if-no-files-found: error
      - name: Merge Maven evidence artifact
        if: always()
        uses: actions/upload-artifact/merge@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approval-maven-${{ github.run_id }}
          pattern: approval-maven-part-*-${{ github.run_id }}
          delete-merged: true

  web:
    name: Vben TypeScript / production build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: git diff --check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate
      - name: Install root tooling
        shell: bash
        run: pnpm install --no-frozen-lockfile >root-install.log 2>&1 || { tail -n 160 root-install.log; exit 1; }
      - name: Verify client management boundaries
        shell: bash
        run: pnpm web:test:client-boundary >client-boundary-test.log 2>&1 || { cat client-boundary-test.log; exit 1; }
      - name: Verify form renderer semantics
        shell: bash
        run: pnpm web:test:form-renderer >form-renderer-test.log 2>&1 || { cat form-renderer-test.log; exit 1; }
      - name: Verify form designer section operations
        shell: bash
        run: pnpm web:test:form-designer >form-designer-test.log 2>&1 || { cat form-designer-test.log; exit 1; }
      - name: Benchmark designer topology
        shell: bash
        run: pnpm web:benchmark:designer >designer-benchmark.log 2>&1 || { cat designer-benchmark.log; exit 1; }
      - name: Install Vben workspace
        shell: bash
        run: pnpm web:install >web-install.log 2>&1 || { tail -n 180 web-install.log; exit 1; }
      - name: Type-check Vben application
        shell: bash
        run: pnpm web:typecheck >web-typecheck.log 2>&1 || { cat web-typecheck.log; exit 1; }
      - name: Build Vben application
        shell: bash
        run: pnpm web:build >web-build.log 2>&1 || { tail -n 220 web-build.log; exit 1; }
      - name: Upload Vben verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approval-vben-${{ github.run_id }}
          path: |
            root-install.log
            client-boundary-test.log
            form-renderer-test.log
            form-designer-test.log
            designer-benchmark.log
            web-install.log
            web-typecheck.log
            web-build.log
          if-no-files-found: ignore

  mobile:
    name: UniApp TypeScript / H5 / WeChat
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: git diff --check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate
      - name: Install root tooling
        shell: bash
        run: pnpm install --no-frozen-lockfile >root-install.log 2>&1 || { tail -n 160 root-install.log; exit 1; }
      - name: Install UniApp workspace
        shell: bash
        run: pnpm mobile:install >mobile-install.log 2>&1 || { tail -n 180 mobile-install.log; exit 1; }
      - name: Type-check UniApp application
        shell: bash
        run: pnpm mobile:typecheck >mobile-typecheck.log 2>&1 || { cat mobile-typecheck.log; exit 1; }
      - name: Build H5 application
        shell: bash
        run: pnpm mobile:build:h5 >mobile-h5.log 2>&1 || { tail -n 220 mobile-h5.log; exit 1; }
      - name: Build WeChat Mini Program
        shell: bash
        run: pnpm mobile:build:weixin >mobile-weixin.log 2>&1 || { tail -n 220 mobile-weixin.log; exit 1; }
      - name: Upload mobile verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approval-mobile-${{ github.run_id }}
          path: |
            root-install.log
            mobile-install.log
            mobile-typecheck.log
            mobile-h5.log
            mobile-weixin.log
          if-no-files-found: ignore

  online-images:
    name: Online evaluation / real image startup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify image packaging and runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/tests/product-readiness-online-demo-images.test.mjs \
            scripts/tests/product-readiness-online-demo-runtime.test.mjs \
            2>&1 | tee online-image-contracts.log
      - name: Build and probe exact-source images when inputs change
        shell: bash
        run: |
          set -euo pipefail
          node scripts/product-readiness/online-demo-images-runtime.mjs ci \
            2>&1 | tee online-image-runtime.log
      - name: Retain image build and runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approval-online-images-${{ github.run_id }}
          path: |
            online-image-contracts.log
            online-image-runtime.log
            .runtime/online-demo-images/*/image-build.json
            .runtime/online-demo-image-runtime/*/*.json
          include-hidden-files: true
          if-no-files-found: error

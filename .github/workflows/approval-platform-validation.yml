name: Approval Platform Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-p4-final-correction:
    if: github.event.pull_request.head.ref == 'agent/m6-f-controlled-automation-and-ai-governance'
    runs-on: ubuntu-24.04
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply exact final P4 correction
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=-1):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected text missing in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, count))

          configuration = (
              "apps/server/src/main/java/io/github/akaryc1b/approval/config/"
              "ControlledAutomationLineageConfiguration.java"
          )
          replace(
              configuration,
              "org.springframework.boot.autoconfigure.flyway.FlywayConfigurationCustomizer",
              "org.springframework.boot.flyway.autoconfigure.FlywayConfigurationCustomizer",
          )

          migration = (
              "server-modules/approval-persistence-jdbc/src/main/resources/m6f/db/migration/"
              "V50__create_ai_controlled_automation_lineage.sql"
          )
          replace(
              migration,
              " current_event_hash varchar(64);\n",
              " lineage_event_hash varchar(64);\n",
          )
          replace(
              migration,
              "select revision,status,current_event_hash,operator_evidence_hash\n"
              " into current_revision,current_status,current_event_hash,current_operator_hash\n"
              " from ap_ai_controlled_automation_lineage\n",
              "select lineage.revision,lineage.status,lineage.current_event_hash,\n"
              "       lineage.operator_evidence_hash\n"
              " into current_revision,current_status,lineage_event_hash,current_operator_hash\n"
              " from ap_ai_controlled_automation_lineage lineage\n",
          )
          replace(
              migration,
              "or current_event_hash<>new.event_hash then",
              "or lineage_event_hash<>new.event_hash then",
          )
          replace(
              migration,
              "or new.predecessor_hash<>current_event_hash then",
              "or new.predecessor_hash<>lineage_event_hash then",
          )

          release_test = (
              "server-modules/approval-persistence-jdbc/src/test/java/"
              "io/github/akaryc1b/approval/persistence/jdbc/"
              "JdbcApprovalReleaseLifecycleMigrationIntegrationTest.java"
          )
          replace(
              release_test,
              "v32BackfillRemainsValidWhenRepositoryAdvancesThroughGovernedV49",
              "v32BackfillRemainsValidWhenRepositoryAdvancesThroughGovernedV50",
          )
          replace(
              release_test,
              '.locations("classpath:db/migration")',
              '.locations("classpath:db/migration", "classpath:m6f/db/migration")',
          )
          replace(release_test, 'assertEquals("49",', 'assertEquals("50",')
          PY
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/approval-platform-validation.yml \
            > .github/workflows/approval-platform-validation.yml
          git diff --check
          node --test scripts/tests/m6-f-p4-durable-lineage-boundary.test.mjs
          mvn -B -ntp -pl :approval-server -am -DskipTests compile
          mvn -B -ntp -pl :approval-persistence-jdbc -am test \
            -Dtest=io.github.akaryc1b.approval.persistence.jdbc.JdbcControlledAutomationLineageStoreIntegrationTest,io.github.akaryc1b.approval.persistence.jdbc.JdbcApprovalReleaseLifecycleMigrationIntegrationTest \
            -Dsurefire.failIfNoSpecifiedTests=false
      - name: Commit final P4 correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "approval-platform automation"
          git config user.email "approval-platform-automation@users.noreply.github.com"
          git add -A
          git commit -m "fix(m6-f): close P4 Flyway and trigger defects"
          git push origin "HEAD:${TARGET_BRANCH}"

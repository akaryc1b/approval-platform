name: Approval Mobile CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate
      - name: Prepare pinned Unibest workspace
        run: pnpm mobile:bootstrap
      - name: Install mobile dependencies
        working-directory: .upstream/unibest
        run: pnpm install --no-frozen-lockfile
      - name: Generate Unibest base files
        working-directory: .upstream/unibest
        run: pnpm init-baseFiles
      - name: Type check approval mobile
        working-directory: .upstream/unibest
        run: |
          set -o pipefail
          pnpm type-check 2>&1 | tee ../../mobile-typecheck.log
      - name: Upload type-check failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-typecheck-log
          path: mobile-typecheck.log
          if-no-files-found: error
      - name: Build H5
        working-directory: .upstream/unibest
        run: pnpm build:h5
      - name: Build WeChat Mini Program
        working-directory: .upstream/unibest
        run: pnpm build:mp-weixin

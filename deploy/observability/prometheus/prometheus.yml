global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: approval-platform
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets:
          - approval-platform:8081
        labels:
          service: approval-platform
          environment: production

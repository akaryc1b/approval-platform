route:
  receiver: approval-platform-operations
  group_by:
    - alertname
    - environment
    - instance
    - application
    - provider
    - operation
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: approval-platform-operations
    webhook_configs:
      - url: http://approval-ops-notifier:8080/api/v1/alerts
        send_resolved: true
        max_alerts: 50

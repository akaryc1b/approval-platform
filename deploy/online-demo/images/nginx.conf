worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /app/public;
        index index.html;
        client_max_body_size 16k;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-store" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        location = /healthz { return 200 "static-assets-ready\n"; }
        location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }
        # No business or management proxy until the isolated gateway is accepted.
        location = /api { return 404; }
        location ^~ /api/ { return 404; }
        location = /approval-api { return 404; }
        location ^~ /approval-api/ { return 404; }
        location = /actuator { return 404; }
        location ^~ /actuator/ { return 404; }
        location = /payment-sandbox { return 404; }
        location ^~ /payment-sandbox/ { return 404; }
        location ~ (^|/)\. { return 404; }
        location ~* \.(map|ya?ml|env|pem|key|p12|pfx|sql|dump|log)(\.gz|\.br)?$ { return 404; }
        location ~* \.(js|mjs|css|json|webmanifest|txt|svg|png|jpg|jpeg|gif|webp|avif|ico|woff|woff2|ttf|otf|eot|wasm|mp4|webm|gz|br)$ {
            try_files $uri =404;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}

# Disposable native test receiver, not a production telemetry backend.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 100ms
    limit_mib: 64
    spike_limit_mib: 16
  batch:
    timeout: 100ms
    send_batch_size: 8
    send_batch_max_size: 8
exporters:
  file:
    path: /evidence/traces.jsonl
    format: json
    rotation:
      max_megabytes: 1
      max_backups: 1
service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file]

spring:
  application:
    name: approval-platform
  datasource:
    url: ${APPROVAL_DB_URL:jdbc:postgresql://localhost:5432/approval}
    username: ${APPROVAL_DB_USERNAME:approval}
    password: ${APPROVAL_DB_PASSWORD:approval}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

flowable:
  database-schema-update: false
  async-executor-activate: true
  history-level: audit

approval:
  database:
    expected-vendor: ${APPROVAL_DATABASE_VENDOR:POSTGRESQL}
  security:
    identity:
      mode: ${APPROVAL_IDENTITY_MODE:principal}
    management-permissions:
      enforced: ${APPROVAL_MANAGEMENT_PERMISSIONS_ENFORCED:true}
      trusted-header-name: ${APPROVAL_MANAGEMENT_TRUSTED_HEADER:X-Approval-Trusted-Permissions}
  process-template:
    platform-protocol-version: ${APPROVAL_TEMPLATE_PLATFORM_PROTOCOL_VERSION:1.0.0}
    connector-capabilities: ${APPROVAL_TEMPLATE_CONNECTOR_CAPABILITIES:}
    business-reference-types: ${APPROVAL_TEMPLATE_BUSINESS_REFERENCE_TYPES:}
    organization-placeholders: ${APPROVAL_TEMPLATE_ORGANIZATION_PLACEHOLDERS:}
    identity-placeholders: ${APPROVAL_TEMPLATE_IDENTITY_PLACEHOLDERS:}
  migration:
    execution:
      enabled: ${APPROVAL_MIGRATION_EXECUTION_ENABLED:false}
    worker:
      enabled: ${APPROVAL_MIGRATION_WORKER_ENABLED:false}
    orchestration:
      enabled: ${APPROVAL_MIGRATION_ORCHESTRATION_ENABLED:false}
    aggregation:
      enabled: ${APPROVAL_MIGRATION_AGGREGATION_ENABLED:false}
    kill-switch:
      enabled: ${APPROVAL_MIGRATION_KILL_SWITCH_ENABLED:false}
      revision: ${APPROVAL_MIGRATION_KILL_SWITCH_REVISION:1}
      reason-code: ${APPROVAL_MIGRATION_KILL_SWITCH_REASON_CODE:CONFIGURED_OFF}
    reconciliation:
      automatic:
        enabled: ${APPROVAL_MIGRATION_RECONCILIATION_AUTOMATIC_ENABLED:false}
  connector:
    secret-material:
      enabled: false
      backend-selection: BLOCKED_PENDING_BACKEND_SELECTION
    dingtalk-token:
      enabled: false
      policy-version: dingtalk-token-policy-v1
      refresh-before-expiry: 5m
      minimum-validity: 30s
      maximum-lifetime: 2h
      single-flight-wait: 5s
      maximum-entries: 256
    invocation:
      enabled: false
      policy-version: connector-invocation-policy-v1
      maximum-request-bytes: 65536
      maximum-response-bytes: 262144
      timeout: 5s
      kill-switch-revision: kill-switch-v1
      token-policy-version: dingtalk-token-policy-v1
    operations-diagnostics:
      enabled: false
      maximum-entries: 1024
      maximum-entries-per-tenant: 256
      maximum-response-bytes: 262144
    tenant-routing:
      enabled: false
    generic:
      enabled: ${APPROVAL_GENERIC_CONNECTOR_ENABLED:false}
      connector-key: ${APPROVAL_GENERIC_CONNECTOR_KEY:generic-rest}
      host-base-uri: ${APPROVAL_GENERIC_HOST_BASE_URI:http://127.0.0.1:19090}
      callback-uri: ${APPROVAL_GENERIC_CALLBACK_URI:http://127.0.0.1:19090/api/approval-callback/v1/events}
      key-id: ${APPROVAL_GENERIC_KEY_ID:}
      secret: ${APPROVAL_GENERIC_SECRET:}
      timeout: ${APPROVAL_GENERIC_TIMEOUT:10s}
      dispatch:
        enabled: ${APPROVAL_GENERIC_DISPATCH_ENABLED:true}
        fixed-delay: ${APPROVAL_GENERIC_DISPATCH_FIXED_DELAY:5s}
        batch-size: ${APPROVAL_GENERIC_DISPATCH_BATCH_SIZE:50}
        lease-duration: ${APPROVAL_GENERIC_DISPATCH_LEASE:30s}
        initial-delay: ${APPROVAL_GENERIC_RETRY_INITIAL_DELAY:1s}
        maximum-delay: ${APPROVAL_GENERIC_RETRY_MAXIMUM_DELAY:5m}
        maximum-attempts: ${APPROVAL_GENERIC_RETRY_MAXIMUM_ATTEMPTS:10}
        jitter-ratio: ${APPROVAL_GENERIC_RETRY_JITTER_RATIO:0.2}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful

flowable:
  database-schema-update: true

logging:
  level:
    io.github.akaryc1b.approval: DEBUG

approval:
  demo:
    purchase-payment:
      enabled: ${APPROVAL_DEMO_PURCHASE_PAYMENT_ENABLED:false}
      sandbox:
        enabled: ${APPROVAL_DEMO_PAYMENT_SANDBOX_ENABLED:false}
        port: ${APPROVAL_DEMO_PAYMENT_SANDBOX_PORT:18081}
        control-file: ${APPROVAL_DEMO_PAYMENT_SANDBOX_CONTROL_FILE:}
        status-file: ${APPROVAL_DEMO_PAYMENT_SANDBOX_STATUS_FILE:}
        maximum-clock-skew: ${APPROVAL_DEMO_PAYMENT_SANDBOX_CLOCK_SKEW:5m}
  security:
    identity:
      mode: local-headers
    management-permissions:
      enforced: true
